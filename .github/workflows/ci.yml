name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          # 빌드 시점에는 실제 키가 필요 없지만, Anthropic 클라이언트 생성 코드가
          # 값 존재 여부만 확인하므로 더미 값으로 빌드 검증만 수행한다.
          ANTHROPIC_API_KEY: dummy-key-for-ci-build-only
